services:
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

  backend:
    image: lena20041/azure-rag-chatbot-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - chromadb

  chatbot:
    image: lena20041/azure-rag-chatbot-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  chroma_data: